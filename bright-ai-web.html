<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Bright AI Live</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #ffbd18;
      --orange: #ff7a2f;
      --red: #ff3f5f;
      --bg: #07070f;
    }

    html, body { height: 100%; }
    body {
      height: 100dvh;
      overflow: hidden;
      font-family: "Google Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse 90% 48% at 52% 104%, rgba(255,63,95,.86) 0%, rgba(255,122,47,.76) 34%, rgba(82,36,34,.58) 58%, transparent 76%),
        linear-gradient(180deg, #111113 0%, #111217 36%, #241819 58%, #5d2b20 78%, #ffbd18 100%);
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .app {
      position: relative;
      height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      isolation: isolate;
    }

    .glow {
      position: absolute;
      inset: auto 0 0;
      height: 58%;
      opacity: .72;
      pointer-events: none;
      z-index: -1;
    }
    .glow::before,
    .glow::after { content: ""; position: absolute; inset: 0; }
    .glow::before {
      inset: 18% -8% -18%;
      background:
        radial-gradient(ellipse 10% 58% at 10% 100%, rgba(255,189,24,.48), transparent 74%),
        radial-gradient(ellipse 12% 70% at 22% 100%, rgba(255,122,47,.52), transparent 72%),
        radial-gradient(ellipse 13% 76% at 47% 100%, rgba(255,63,95,.58), transparent 74%),
        radial-gradient(ellipse 13% 82% at 73% 100%, rgba(255,122,47,.5), transparent 74%),
        radial-gradient(ellipse 10% 58% at 88% 100%, rgba(255,189,24,.46), transparent 72%);
      filter: blur(30px);
      animation: wave 1.4s ease-in-out infinite;
    }
    .glow::after {
      background: radial-gradient(ellipse 90% 68% at 50% 100%, rgba(255,189,24,.72) 0%, rgba(255,122,47,.5) 38%, rgba(255,63,95,.36) 62%, transparent 84%);
      filter: blur(28px);
      animation: breathe 3.8s ease-in-out infinite;
    }
    .glow.idle::before { opacity: 0; }
    .glow.idle::after { animation-duration: 5s; opacity: .72; }
    .glow.listening::before { animation-duration: .9s; }
    .glow.speaking::before { animation-duration: .62s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(.72) translateY(10%); }
      50% { transform: scaleY(1.22) translateY(-4%); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .68; transform: scaleY(.96); }
      50% { opacity: .94; transform: scaleY(1.04); }
    }

    main {
      min-height: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 0 20px 80px;
    }
    .orb-wrap {
      position: relative;
      width: min(310px, 70vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
      animation: ring 4s ease-in-out infinite;
    }
    .r1 { width: 78%; height: 78%; opacity: .55; }
    .r2 { width: 98%; height: 98%; opacity: .24; animation-delay: .6s; }
    @keyframes ring {
      0%, 100% { transform: scale(.96); }
      50% { transform: scale(1.05); }
    }
    .orb {
      width: 56%;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: linear-gradient(145deg, var(--gold) 0%, var(--orange) 48%, var(--red) 100%);
      box-shadow: 0 0 52px rgba(255,122,47,.5), inset 0 -14px 42px rgba(0,0,0,.2);
      animation: idle 3.2s ease-in-out infinite;
    }
    .orb::after {
      content: "";
      position: absolute;
      top: 13%;
      left: 50%;
      transform: translateX(-50%);
      width: 42%;
      height: 17%;
      border-radius: 50%;
      background: rgba(255,255,255,.28);
    }
    .orb.listening { animation: active .75s ease-in-out infinite; }
    .orb.speaking { animation: speak .62s ease-in-out infinite; }
    @keyframes idle {
      0%, 100% { transform: scale(.98); }
      50% { transform: scale(1.04); }
    }
    @keyframes active {
      0%, 100% { transform: scale(1.03); }
      50% { transform: scale(1.15); }
    }
    @keyframes speak {
      0%, 100% { transform: scale(1.02); }
      35% { transform: scale(1.16); }
      70% { transform: scale(1.07); }
    }

    footer {
      padding: 0 32px max(28px, env(safe-area-inset-bottom));
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    .stop {
      border: 1px solid rgba(255,88,88,.5);
      background: rgba(255,88,88,.12);
      color: #ffaaaa;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 26px;
      border-radius: 22px;
      display: none;
    }
    .stop.visible { display: block; }
    .mic {
      width: 82px;
      height: 82px;
      border: none;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, var(--gold) 0%, var(--orange) 48%, var(--red) 100%);
      box-shadow: 0 8px 32px rgba(255,95,62,.42);
      display: grid;
      place-items: center;
      transition: transform .15s, box-shadow .2s, opacity .2s;
    }
    .mic.recording {
      transform: scale(.94);
      box-shadow: 0 8px 34px rgba(255,95,62,.5);
    }
    .mic.live {
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 8px 34px rgba(255,95,62,.34), inset 0 0 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
    }
    .mic:disabled { opacity: .42; cursor: default; }
    .mic svg { width: 31px; height: 31px; fill: currentColor; }
    .mic .icon-live { display: none; }
    .mic.live .icon-mic { display: none; }
    .mic.live .icon-live { display: block; }
    .support {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      padding: 0 15px;
      color: #fff;
      background: rgba(255,255,255,.08);
      box-shadow: 0 14px 36px rgba(0,0,0,.22);
      backdrop-filter: blur(18px);
      font-size: 14px;
      font-weight: 700;
      transition: transform .15s, background .2s;
    }
    .support:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.14);
    }
    .support svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .level,
    .subtitle,
    .hint,
    .mic-hint {
      display: none !important;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      max-width: min(460px, calc(100vw - 32px));
      transform: translate(-50%, 16px);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(12,12,24,.92);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 99;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 110;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 80% 46% at 50% 106%, rgba(255,189,24,.72), rgba(255,122,47,.38) 44%, transparent 76%),
        rgba(9,9,13,.92);
      backdrop-filter: blur(24px);
    }
    .auth-gate.hidden { display: none; }
    .auth-card {
      width: min(430px, 100%);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      padding: 28px;
      text-align: center;
      box-shadow: 0 34px 90px rgba(0,0,0,.36);
    }
    .auth-dot {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--orange), var(--red));
      box-shadow: 0 0 34px rgba(255,122,47,.54);
    }
    .auth-card h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.08;
    }
    .auth-card p {
      color: rgba(255,255,255,.66);
      line-height: 1.5;
      margin: 12px 0 22px;
    }
    .auth-card .privacy-note {
      margin-top: -8px;
      color: rgba(255,255,255,.48);
      font-size: 13px;
    }
    #googleSignIn {
      display: grid;
      justify-content: center;
    }
    .auth-error {
      margin-top: 14px;
      color: #ffb4b4;
      min-height: 20px;
      font-size: 14px;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 74% 52% at 50% 112%, rgba(255,189,24,.9), rgba(255,122,47,.64) 42%, transparent 74%),
        radial-gradient(circle at 50% 45%, rgba(255,63,95,.2), transparent 34%),
        #0b0b10;
      transition: opacity .7s ease, visibility .7s ease;
    }
    .splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-brand {
      text-align: center;
      transform: translateY(12px) scale(.98);
      animation: splashIn 1.05s cubic-bezier(.16, 1, .3, 1) both;
    }
    .splash-title {
      font-size: clamp(48px, 11vw, 118px);
      font-weight: 520;
      line-height: .95;
      letter-spacing: 0;
      background: linear-gradient(135deg, #fff 0%, #fff5d2 36%, #ffbd18 58%, #ff3f5f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 26px 70px rgba(255,95,62,.25);
    }
    .splash-byline {
      margin-top: 14px;
      color: rgba(255,255,255,.66);
      font-size: clamp(14px, 2.4vw, 20px);
      font-weight: 600;
    }
    .splash-line {
      width: min(280px, 54vw);
      height: 3px;
      margin: 28px auto 0;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.12);
    }
    .splash-line::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--orange), var(--red));
      animation: splashLoad 1.2s ease-in-out infinite;
    }
    @keyframes splashIn {
      0% { opacity: 0; transform: translateY(24px) scale(.94); filter: blur(12px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes splashLoad {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-dot"></div>
      <h2>Connexion a Blashenche</h2>
      <p>Connecte-toi avec Google pour demarrer ton experience vocale et retrouver un acces simple a Blashenche.</p>
      <p class="privacy-note">Ton email sert uniquement a securiser l'acces et mesurer l'utilisation de Blashenche.</p>
      <div id="googleSignIn"></div>
      <div id="authError" class="auth-error"></div>
    </div>
  </div>

  <div id="splash" class="splash">
    <div class="splash-brand">
      <div class="splash-title">Blashenche</div>
      <div class="splash-byline">By Eto Juliano Bright</div>
      <div class="splash-line"></div>
    </div>
  </div>

  <div class="app">
    <a class="support" href="https://wa.me/23057191509?text=Bonjour%20Blashenche%2C%20j%27ai%20besoin%20d%27assistance." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.82 11.82 0 0 0 12.1 0C5.54 0 .2 5.34.2 11.9c0 2.1.55 4.16 1.6 5.97L.1 24l6.28-1.65a11.86 11.86 0 0 0 5.72 1.46h.01c6.56 0 11.9-5.34 11.9-11.9 0-3.18-1.24-6.17-3.49-8.43ZM12.1 21.8h-.01a9.86 9.86 0 0 1-5.03-1.38l-.36-.21-3.73.98 1-3.64-.23-.37a9.86 9.86 0 0 1-1.51-5.28C2.23 6.45 6.66 2 12.11 2a9.82 9.82 0 0 1 6.99 2.9A9.82 9.82 0 0 1 22 11.91c0 5.45-4.44 9.89-9.9 9.89Zm5.43-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.48-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.48 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>
      <span>Assistance</span>
    </a>
    <div id="glow" class="glow idle"></div>
    <main>
      <section>
        <p id="status" class="hint">Connecting...</p>
        <div class="orb-wrap">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div id="orb" class="orb"></div>
        </div>
        <div class="level"><span id="level"></span></div>
        <div id="subtitle" class="subtitle"></div>
      </section>
    </main>

    <footer>
      <button id="stop" class="stop">Stop</button>
      <button id="mic" class="mic" disabled aria-label="Microphone">
        <svg class="icon-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        <svg class="icon-live" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"/></svg>
      </button>
      <span id="micHint" class="mic-hint">Click to speak</span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const WS_URL = location.protocol.startsWith('http')
      ? `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`
      : 'ws://localhost:3001';
    const INPUT_SR = 16000;
    const OUTPUT_SR = 24000;
    const CHUNK = 2048;

    let appConfig = {};
    let currentUser = null;
    let ws = null;
    let ready = false;
    let sessionActive = false;
    let recording = false;
    let playing = false;
    let micStream = null;
    let captureCtx = null;
    let processor = null;
    let playCtx = null;
    let nextPlayAt = 0;
    let sources = new Set();
    let transcript = '';
    let aiText = '';
    let lastSpeechAt = 0;
    let inSpeech = false;
    let lastActivityEndAt = 0;
    let autoRestartTimer = null;

    const mic = document.getElementById('mic');
    const stopBtn = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    const orb = document.getElementById('orb');
    const glow = document.getElementById('glow');
    const levelBar = document.getElementById('level');
    const micHint = document.getElementById('micHint');
    const splash = document.getElementById('splash');
    const authGate = document.getElementById('authGate');
    const authError = document.getElementById('authError');

    init();
    window.addEventListener('load', () => {
      setTimeout(() => splash.classList.add('hidden'), 1800);
    });

    async function init() {
      await loadConfig();
      setupAnalytics();
      setupGoogleSignIn();
      connect();
      trackEvent('app_view');
    }

    async function loadConfig() {
      try {
        const response = await fetch('/config');
        appConfig = await response.json();
      } catch {
        appConfig = {};
      }
    }

    function setupAnalytics() {
      if (!appConfig.gaMeasurementId) return;
      const script = document.createElement('script');
      script.async = true;
      script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(appConfig.gaMeasurementId)}`;
      document.head.appendChild(script);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function gtag(){ dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', appConfig.gaMeasurementId);
    }

    function setupGoogleSignIn() {
      const saved = localStorage.getItem('blashenche_user');
      if (saved) {
        try {
          setAuthenticatedUser(JSON.parse(saved), false);
          return;
        } catch {
          localStorage.removeItem('blashenche_user');
        }
      }

      if (!appConfig.googleClientId) {
        authError.textContent = 'GOOGLE_CLIENT_ID doit etre configure sur Render.';
        return;
      }

      waitForGoogleIdentity(() => {
        google.accounts.id.initialize({
          client_id: appConfig.googleClientId,
          callback: handleGoogleCredential,
        });
        google.accounts.id.renderButton(document.getElementById('googleSignIn'), {
          theme: 'filled_black',
          size: 'large',
          shape: 'pill',
          text: 'continue_with',
          width: 280,
        });
      });
    }

    function waitForGoogleIdentity(callback, tries = 0) {
      if (window.google?.accounts?.id) {
        callback();
        return;
      }
      if (tries > 80) {
        authError.textContent = 'Google Sign-In ne s est pas charge. Recharge la page.';
        return;
      }
      setTimeout(() => waitForGoogleIdentity(callback, tries + 1), 100);
    }

    window.handleGoogleCredential = async ({ credential }) => {
      authError.textContent = '';
      try {
        const response = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Connexion Google impossible');
        setAuthenticatedUser(data.user, true);
      } catch (err) {
        authError.textContent = err.message || 'Connexion Google impossible.';
      }
    };

    function setAuthenticatedUser(user, track = true) {
      currentUser = user;
      localStorage.setItem('blashenche_user', JSON.stringify(user));
      authGate.classList.add('hidden');
      if (track) trackEvent('login_success', { method: 'google' });
    }

    function trackEvent(name, params = {}) {
      if (window.gtag) gtag('event', name, params);
    }

    function recordUsage(type) {
      if (!currentUser) return;
      fetch('/api/usage/event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, user: currentUser }),
      }).catch(() => {});
    }

    function connect() {
      setStatus('Connecting...');
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'START', name: 'there', language: 'fr-FR' }));
      };
      ws.onmessage = ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { return; }
        handleMessage(msg);
      };
      ws.onclose = () => {
        setReady(false);
        setTimeout(connect, 1800);
      };
      ws.onerror = () => setReady(false);
    }

    function handleMessage(msg) {
      if (msg.type === 'READY') {
        setReady(true);
        setStatus('Ready.');
      }
      if (msg.type === 'AUDIO') {
        playPCM(msg.data);
        playing = true;
        setMode('speaking');
        stopBtn.classList.add('visible');
      }
      if (msg.type === 'INPUT_TEXT') {
        transcript = msg.text || transcript;
      }
      if (msg.type === 'TEXT') {
        aiText += msg.text || '';
      }
      if (msg.type === 'DONE') waitPlaybackDone();
      if (msg.type === 'INTERRUPTED') {
        stopPlayback();
        setMode(recording ? 'listening' : 'idle');
      }
      if (msg.type === 'ERROR') {
        toast(msg.message || 'Gemini error');
        setStatus('Error');
      }
    }

    mic.addEventListener('click', async () => {
      if (!currentUser) {
        authGate.classList.remove('hidden');
        toast('Connecte-toi avec Google pour utiliser Blashenche.');
        return;
      }
      if (!ready) {
        toast('Gemini is not ready yet.');
        return;
      }
      if (sessionActive) {
        stopLiveSession();
        return;
      }
      await startLiveSession();
    });

    async function startLiveSession() {
      sessionActive = true;
      mic.classList.add('live');
      trackEvent('mic_session_start');
      recordUsage('mic_start');
      if (playing) {
        stopPlayback();
        send({ type: 'INTERRUPT' });
      }
      try {
        await startCapture();
      } catch (err) {
        toast(err.name === 'NotAllowedError' ? 'Microphone permission denied' : (err.message || 'Microphone error'));
        setStatus('Microphone blocked');
        sessionActive = false;
        mic.classList.remove('live');
      }
    }

    function stopLiveSession() {
      sessionActive = false;
      clearTimeout(autoRestartTimer);
      if (recording) stopCapture({ endStream: true });
      if (playing) {
        stopPlayback();
        send({ type: 'INTERRUPT' });
      }
      mic.classList.remove('live');
      stopBtn.classList.remove('visible');
      setMode('idle');
      setStatus('Ready.');
    }

    stopBtn.addEventListener('click', () => {
      stopLiveSession();
    });

    async function startCapture() {
      if (!sessionActive || recording) return;
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          sampleRate: INPUT_SR,
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });
      captureCtx = new AudioContext({ sampleRate: INPUT_SR });
      const src = captureCtx.createMediaStreamSource(micStream);
      processor = captureCtx.createScriptProcessor(CHUNK, 1, 1);
      src.connect(processor);
      processor.connect(captureCtx.destination);

      recording = true;
      transcript = '';
      aiText = '';
      mic.classList.add('recording');
      micHint.textContent = 'Click again to stop';
      setMode('listening');
      setStatus('Listening...');

      processor.onaudioprocess = (event) => {
        if (!recording || ws?.readyState !== WebSocket.OPEN) return;
        const input = event.inputBuffer.getChannelData(0);
        const pcm = new Int16Array(input.length);
        let energy = 0;
        for (let i = 0; i < input.length; i++) {
          const sample = Math.max(-1, Math.min(1, input[i]));
          energy += sample * sample;
          pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }
        const level = Math.sqrt(energy / input.length);
        updateMicLevel(level);
        send({ type: 'AUDIO', data: bufferToBase64(pcm.buffer) });
      };
    }

    function stopCapture({ endStream = false } = {}) {
      recording = false;
      mic.classList.remove('recording');
      micHint.textContent = 'Click to speak';
      levelBar.style.width = '0%';
      if (processor) { processor.disconnect(); processor = null; }
      if (micStream) { micStream.getTracks().forEach((track) => track.stop()); micStream = null; }
      if (captureCtx) { captureCtx.close().catch(() => {}); captureCtx = null; }
      if (endStream) send({ type: 'TURN_COMPLETE' });
      inSpeech = false;
      setMode('idle');
      setStatus('Ready.');
    }

    function updateMicLevel(level) {
      const pct = Math.min(100, Math.round(level * 900));
      levelBar.style.width = `${pct}%`;
      const now = performance.now();
      if (pct > 5) {
        lastSpeechAt = now;
        if (!inSpeech && now - lastActivityEndAt > 220) {
          inSpeech = true;
        }
      } else if (inSpeech && now - lastSpeechAt > 820) {
        inSpeech = false;
        lastActivityEndAt = now;
      }
    }

    function playPCM(base64) {
      ensurePlayCtx();
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const pcm = new Int16Array(bytes.buffer);
      if (!pcm.length) return;
      const floats = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) floats[i] = pcm[i] / 32768;
      const buffer = playCtx.createBuffer(1, floats.length, OUTPUT_SR);
      buffer.copyToChannel(floats, 0);
      const src = playCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(playCtx.destination);
      src.onended = () => sources.delete(src);
      sources.add(src);
      const at = Math.max(playCtx.currentTime + .04, nextPlayAt);
      src.start(at);
      nextPlayAt = at + buffer.duration;
    }

    function ensurePlayCtx() {
      if (!playCtx || playCtx.state === 'closed') {
        playCtx = new AudioContext({ sampleRate: OUTPUT_SR });
        nextPlayAt = playCtx.currentTime;
      }
      if (playCtx.state === 'suspended') playCtx.resume().catch(() => {});
    }

    function waitPlaybackDone() {
      if (!playCtx || playCtx.currentTime >= nextPlayAt - .08) {
        playing = false;
        stopBtn.classList.remove('visible');
        setMode(sessionActive && recording ? 'listening' : 'idle');
        setStatus('Ready.');
      } else {
        setTimeout(waitPlaybackDone, 120);
      }
    }

    function stopPlayback() {
      playing = false;
      sources.forEach((src) => { try { src.stop(); } catch (_) {} });
      sources.clear();
      if (playCtx && playCtx.state !== 'closed') playCtx.close().catch(() => {});
      playCtx = null;
      nextPlayAt = 0;
      stopBtn.classList.remove('visible');
    }

    function send(payload) {
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
    }

    function setReady(ok) {
      ready = ok;
      mic.disabled = !ok;
      if (!ok && sessionActive) stopLiveSession();
    }

    function setMode(mode) {
      orb.className = `orb ${mode === 'idle' ? '' : mode}`;
      glow.className = `glow ${mode}`;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function toast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 3400);
    }

    function bufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }
  </script>
</body>
</html>
